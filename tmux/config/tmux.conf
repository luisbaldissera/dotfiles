# remap prefix from 'C-b' to 'C-a'
unbind C-b
unbind C-w
set-option -g prefix C-a
bind-key C-a send-prefix

# Keep pane navigation out of the prefix table; C-w owns every direction.
unbind-key -q -T prefix h
unbind-key -q -T prefix j
unbind-key -q -T prefix k
unbind-key -q -T prefix l
unbind-key -q -T prefix Left
unbind-key -q -T prefix Down
unbind-key -q -T prefix Up
unbind-key -q -T prefix Right

# Let Neovim own C-w commands; elsewhere, use C-w plus a direction for panes.
# Neovim supplies the boundary-aware handoff through vim-tmux-navigator.
bind-key -n C-w if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-w' 'switch-client -T vim-tmux-navigation'
bind-key -T vim-tmux-navigation h select-pane -L
bind-key -T vim-tmux-navigation j select-pane -D
bind-key -T vim-tmux-navigation k select-pane -U
bind-key -T vim-tmux-navigation l select-pane -R
bind-key -T vim-tmux-navigation Left select-pane -L
bind-key -T vim-tmux-navigation Down select-pane -D
bind-key -T vim-tmux-navigation Up select-pane -U
bind-key -T vim-tmux-navigation Right select-pane -R

# make tmux split panes using v and s
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# set C-u to start scrolling and use vim bindings for scrolling
set -g mode-keys vi
unbind [
bind C-u copy-mode

# Copy to Wayland system clipboard using wl-copy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# List, start, and switch between Laio-managed tmux sessions.
bind-key S display-popup -w 50 -h 16 -E 'laio start --show-picker'

# workmux agent sidebar.
# Pane navigation remains under C-w; C-a is reserved for prefix commands.
bind-key a run-shell 'workmux sidebar on; sidebar_pane="$(tmux list-panes -t "#{window_id}" -f "##{==:##{@workmux_role},sidebar}" -F "##{pane_id}")"; if [ -n "$sidebar_pane" ]; then tmux select-pane -t "$sidebar_pane"; fi'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
